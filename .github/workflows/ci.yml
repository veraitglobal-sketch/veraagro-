# Front + mobile typecheck and backend compile. Jobs are skipped when no matching paths changed.
# Local parity: `npm run parity:typecheck` and `npm run parity:backend` from repo root.
# See docs/WEB_MOBILE_CHANNEL_PARITY_PLAN.md (Q6).

name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch: # Manual: run all three jobs (paths-filter skipped)

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.pick.outputs.web }}
      mobile: ${{ steps.pick.outputs.mobile }}
      backend: ${{ steps.pick.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - name: Check repository hygiene and documentation links
        run: node scripts/check-repository.mjs

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            web:
              - 'web/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

      - name: Set flags (paths or full manual run)
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=${{ steps.filter.outputs.web }}" >> "$GITHUB_OUTPUT"
            echo "mobile=${{ steps.filter.outputs.mobile }}" >> "$GITHUB_OUTPUT"
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
          fi

  web-typecheck:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install & typecheck
        working-directory: web
        run: |
          npm ci
          npm run typecheck

  mobile-typecheck:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install & typecheck
        working-directory: mobile
        run: |
          npm ci
          npm test
          npm run typecheck

  backend-build:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install PostgreSQL tools for isolated integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql libpq-dev
      - name: Install, Prisma generate, test, Nest build
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npm test -- --runInBand
          npm run test:integration
          npm run build

  buyer-browser:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json
      - name: Install PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql libpq-dev
      - name: Install backend
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
      - name: Install web and Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify buyer checkout with isolated database
        working-directory: backend
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buyer-browser-results
          path: backend/test-results/browser
          if-no-files-found: ignore
